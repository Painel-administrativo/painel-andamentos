<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <!-- iOS já aplica cantos arredondados; fundo é quadrado inteiro -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Logo em branco -->
  <g transform="translate(112,112) scale(9)" fill="none" stroke="#ffffff" stroke-linecap="round">
    <rect x="4" y="4" width="24" height="24" rx="5" stroke-width="2.5"/>
    <line x1="10" y1="11" x2="22" y2="11" stroke-width="2.5"/>
    <line x1="10" y1="16" x2="22" y2="16" stroke-width="2.5"/>
    <line x1="10" y1="21" x2="17" y2="21" stroke-width="2.5"/>
  </g>
</svg>
