name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Verificação de tipos TypeScript
        run: npm run check

      - name: Build do projeto
        env:
          # Valores dummy só para o build compilar. Não são usados em runtime.
          SUPABASE_URL: https://dummy.supabase.co
          SUPABASE_ANON_KEY: dummy-key-for-build
        run: npm run build

      - name: Confirmar bundle gerado
        run: |
          test -f dist/index.cjs && echo "✓ Backend bundle OK"
          test -f dist/public/index.html && echo "✓ Frontend bundle OK"
          ls -lh dist/index.cjs dist/public/assets/*.js dist/public/assets/*.css
